name: Daily Keiba News to Discord
on:
  schedule:
    # 毎朝7:00（日本時間）に実行（UTC基準）
    - cron: '0 22 * * *'
  workflow_dispatch:
jobs:
  keiba-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile keiba.py
      - name: Run keiba briefing
        env:
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
          DISCORD_KEIBA_WEBHOOK_URL: \${{ secrets.DISCORD_KEIBA_WEBHOOK_URL }}
          OPENAI_MODEL: \${{ vars.OPENAI_MODEL }}
        run: python keiba.py
